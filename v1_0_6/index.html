:root {
  --bg: #0E0F13;
  --card: #181A20;
  --card-2: #1C1E25;
  --line: #2A2C34;
  --track: #3A3C45;
  --accent: #F5A524;
  --accent-ink: #14110A;
  --text: #F2F2F5;
  --muted: #9A9CA8;
  --nav: #121318;
  --glow: rgba(245, 165, 36, 0.16);
  --radius: 16px;
  --radius-sm: 10px;
  --tap: 48px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

<style id="layout">/* ===== Fireside layout. Uses theme tokens only. ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 var(--side) 24px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.wrap { max-width: 1100px; margin: 0 auto; }

/* header */
/* 1.0.6: one app bar on every tab: 56 px, 24 px / 700 title, same top padding; amber brand only on Home */
.head, .appbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 56px; padding: 0; margin-top: 12px; }
.appbar h1 { flex: 1; margin: 0; font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -0.3px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar h1.brand { color: var(--accent); }
.ptop.appbar .x { margin-left: -12px; }
.ring { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid #2A2D36; display: grid; place-items: center; color: #F2F2F5; background: var(--card); }
.ring:focus-visible { border-color: var(--accent); color: var(--accent); }
.ring svg { width: 22px; height: 22px; }
h2 { font-size: 17px; font-weight: 600; margin: 18px 0 10px; }

/* continue card */
.cont { display: flex; gap: 14px; background: var(--card); border-radius: var(--radius); padding: 10px; border: 1px solid #1f2128; }
.cont .cv { width: 108px; height: 112px; flex: none; border-radius: var(--radius-sm); }
.cont .info { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-top: 6px; }
.cont .t { font-size: 18px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cont .a { color: var(--muted); font-size: 14px; margin-top: 4px; }
.cont .c { color: var(--muted); font-size: 13px; margin-top: 10px; }
.cont .l { color: var(--accent); font-size: 13px; font-weight: 500; margin-top: 4px; }
.cont .row { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.cont .row .bar { flex: 1; }
.playbtn { width: var(--tap); height: var(--tap); flex: none; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.playbtn svg { width: 20px; height: 20px; }

/* covers */
.cv { position: relative; overflow: hidden; background: var(--card-2); border: 1px solid var(--line); }
/* the real cover sits above the generated title tile (1.0.0 painted the tile over it) */
.cv img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.tile { position: absolute; inset: 0; display: grid; place-items: center; padding: 10px; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.2; color: #fff; }

/* bars */
.bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

/* horizontal rows */
.hrow { display: flex; gap: var(--card-gap); overflow-x: auto; margin: 0 calc(-1 * var(--side)); padding: 0 var(--side) 4px; scroll-padding-inline: var(--side); scrollbar-width: none; }
.hrow::-webkit-scrollbar { display: none; }
.pc { width: 100px; flex: none; text-align: left; }
.pc .cv { width: 100px; height: 118px; border-radius: var(--radius-sm); }
.pc .bar { margin-top: 8px; height: 3px; }
.pc .pct { color: var(--muted); font-size: 12px; margin-top: 6px; }
.pc .added { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: center; }
.none { color: var(--muted); font-size: 14px; padding: 6px 0; }

/* empty state */
.empty { background: var(--card); border-radius: var(--radius); padding: 22px 18px; text-align: center; margin-top: 14px; }
.empty p { color: var(--muted); margin: 8px 0 16px; font-size: 14px; line-height: 1.45; }
.btn { min-height: var(--tap); padding: 0 20px; border-radius: 24px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--track); }
.btn.small { min-height: 40px; font-size: 14px; padding: 0 16px; }

/* library */
.search { display: flex; align-items: center; gap: 10px; height: var(--tap); background: var(--card); border-radius: 14px; padding: 0 14px; margin-top: 12px; border: 1px solid #1f2128; }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; background: none; border: 0; outline: none; font-size: 15px; min-width: 0; }
.search input::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; margin: 14px 0; }
.chip { min-height: 44px; padding: 0 18px; border-radius: 20px; border: 1px solid var(--track); color: #C9CAD2; font-size: 14px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.gc { text-align: left; min-width: 0; border-radius: var(--radius); padding: 0; }
.gc .cv { width: 100%; aspect-ratio: 1; border-radius: var(--radius); }
.gc .done { position: absolute; z-index: 2; right: 8px; bottom: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.gc .done svg { width: 16px; height: 16px; }
.gc .t { font-size: 15px; font-weight: 600; margin-top: 8px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc .a { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* bottom nav */
#nav { flex: none; display: flex; background: var(--nav); border-top: 1px solid #1d1f26; padding-bottom: env(safe-area-inset-bottom); }
#nav button { flex: 1; height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; }
#nav button svg { width: 24px; height: 24px; }
#nav button.on { color: var(--accent); font-weight: 600; }

/* now playing */
#v-player { padding: 0 24px 20px; background: radial-gradient(120% 40% at 50% 0%, var(--glow), transparent 70%), var(--bg); display: flex; flex-direction: column; }
.pwrap { width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; }
.ptop { display: flex; align-items: center; gap: 4px; }
.ptop .x { width: var(--tap); height: var(--tap); display: grid; place-items: center; }
.ptop .x svg { width: 24px; height: 24px; }

.timer { justify-self: end; height: 32px; min-width: 32px; padding: 0 10px; border-radius: 16px; background: rgba(245, 165, 36, 0.14); color: var(--accent); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.timer svg { width: 14px; height: 14px; }
.pcover { width: min(100%, calc(100vh - 590px), 440px); min-width: 150px; aspect-ratio: 1; margin: 8px auto 0; border-radius: var(--radius); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); }
.ptitle { font-size: 26px; font-weight: 700; margin: 20px 0 0; line-height: 1.15; letter-spacing: -0.3px; }
.pauthor { color: var(--muted); font-size: 15px; margin-top: 6px; }
.chapnav { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.chapnav .pchap { flex: 1; min-width: 0; text-align: center; margin-top: 0; }
.cn { width: var(--tap); height: var(--tap); flex: none; display: grid; place-items: center; border-radius: 50%; color: var(--text); background: var(--card-2); border: 1px solid var(--line); }
.cn svg { width: 22px; height: 22px; }
.pchap { color: var(--accent); font-size: 15px; font-weight: 500; margin-top: 8px; min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seek { margin-top: 16px; position: relative; height: 24px; touch-action: none; cursor: pointer; }
.seek .tr { position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--track); }
.seek .fl { position: absolute; left: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--accent); }
.seek .kn { position: absolute; top: 5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); }
.times { display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums; }
.times b { font-weight: 600; }
.times span { color: var(--muted); }
.bookleft { color: var(--muted); font-size: 13px; margin-top: 10px; }
.ctrls { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 16px; }
.cb { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; width: 56px; }
.cb .c { width: 52px; height: 52px; border-radius: 50%; background: var(--card-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--text); }
.cb .c svg { width: 30px; height: 30px; }
.cb.big .c { width: 68px; height: 68px; background: var(--accent); border: 0; color: #fff; }
.cb.big .c svg { width: 30px; height: 30px; }
.cb .lbl { min-height: 14px; }
.speed { display: flex; align-items: center; justify-content: space-between; width: 170px; height: var(--tap); margin: 12px auto 0; border-radius: 24px; background: var(--card-2); border: 1px solid var(--line); }
.speed button { width: var(--tap); height: var(--tap); display: grid; place-items: center; }
.speed button svg { width: 20px; height: 20px; }
.speed .sv { width: auto; min-width: 72px; height: 40px; padding: 0 10px; border-radius: 20px; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }
.speed .sv.off1 { color: var(--accent); }
.speedcap { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
.extras { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.pill { height: var(--tap); padding: 0 14px; border-radius: 24px; background: var(--card-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #D5D6DD; }
.pill svg { width: 18px; height: 18px; }
.pill.on { color: var(--accent); border-color: rgba(245, 165, 36, 0.5); }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; background: var(--card); border-radius: 20px 20px 0 0; padding: 10px 18px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--track); margin: 0 auto 12px; }
.sheet h3 { margin: 4px 0 14px; font-size: 18px; font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt { min-height: var(--tap); border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); font-size: 15px; }
.opt.wide { grid-column: 1 / -1; }
.opt.on { border-color: var(--accent); color: var(--accent); }
.field { display: flex; gap: 8px; margin-top: 10px; }
.field input, .field textarea, textarea.tpl { flex: 1; min-height: var(--tap); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; outline: none; min-width: 0; }
textarea.tpl { width: 100%; padding: 12px; min-height: 110px; resize: vertical; line-height: 1.4; font-size: 14px; }
.list { margin-top: 6px; }
.li { display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid var(--line); }
.li .go { flex: 1; text-align: left; min-height: 56px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.li .go b { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.li .go span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .del, .li .bmr { width: var(--tap); height: var(--tap); display: grid; place-items: center; color: var(--muted); }
.li .del svg, .li .bmr svg { width: 20px; height: 20px; }
.row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); }
.row2 .txt { min-width: 0; }
.row2 .txt b { display: block; font-weight: 500; font-size: 15px; }
.row2 .txt span { color: var(--muted); font-size: 13px; }
.row2 .txt span.path { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row2 .fi { flex: none; color: var(--muted); }
.row2 .fi svg { width: 20px; height: 20px; }
.row2 .txt.grow { flex: 1; }
.btn.small svg { width: 18px; height: 18px; flex: none; }
.btn { white-space: nowrap; }
.rootrm { min-width: var(--tap); height: var(--tap); flex: none; display: grid; place-items: center; color: var(--muted); border-radius: 24px; font-size: 13px; padding: 0 8px; }
.rootrm svg { width: 20px; height: 20px; }
.rootrm.arm { color: #fff; background: #8a2a2a; padding: 0 14px; }
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--track); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw.on { background: var(--accent); }
.sw.on::after { left: 24px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 8px; }
.btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; background: #2A2C34; color: var(--text); border-radius: 14px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); width: max-content; max-width: calc(100vw - 32px); }
#toast button { min-height: 48px; padding: 0 14px; color: var(--accent); font-weight: 600; }
#scanbar { position: fixed; left: 16px; right: 16px; top: 10px; z-index: 25; background: #2A2C34; border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--text); }

.report { font: 11px/1.45 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 52vh; overflow: auto; background: #0E0F13; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0 0; color: var(--text); }
.btn[disabled] { opacity: .45; }


/* ===== 1.0.6 Art Director polish pass (tokens + home + cards + focus) ===== */
:root { --side: 16px; --card-gap: 12px; --row-gap: 28px; --row-head-gap: 12px; --cw: 128px; --hero-cv: 168px; }
@media (min-width: 600px) { :root { --side: 20px; --card-gap: 16px; --cw: 148px; --hero-cv: 208px; } }
@media (min-width: 1000px) { :root { --cw: 168px; } }

/* focus: amber ring for keyboard / D-pad only */
:focus-visible { outline: 2px solid #F5A524; outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
.search:focus-within { border-color: var(--track); }

/* bottom nav: one glyph per tab, colour only */
#nav { padding-bottom: env(safe-area-inset-bottom); }
#nav button { color: #9A9CA8; font-weight: 500; }
#nav button.on { color: #F5A524; font-weight: 600; }

/* meta line: one separator style everywhere */
.meta { display: flex; flex-wrap: wrap; align-items: baseline; font-size: 14px; color: #9A9CA8; }
.sep { margin: 0 6px; color: #9A9CA8; }
.pauthor.meta { justify-content: flex-start; }

/* featured hero */
.hero { position: relative; isolation: isolate; overflow: hidden; border-radius: var(--radius); background: #181A20; padding: 20px; }
.hero .hbg { position: absolute; inset: 0; z-index: -2; overflow: hidden; opacity: .45; }
.hero .hbg img, .hero .hbgt { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(40px); transform: scale(1.25); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(14, 15, 19, 0) 0%, #181A20 70%); }
.hin { display: flex; flex-direction: column; align-items: stretch; gap: 20px; }
.hcv { width: var(--hero-cv); height: var(--hero-cv); flex: none; align-self: center; border-radius: var(--radius); box-shadow: 0 18px 40px rgba(0, 0, 0, .55); }
.htx { flex: 1; min-width: 0; text-align: left; }
.kick { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; line-height: 1.3; }
.ht { margin: 6px 0 0; font-size: 28px; font-weight: 700; line-height: 1.15; letter-spacing: -0.3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hm { margin-top: 8px; }
.hd { color: #9A9CA8; font-size: 14px; line-height: 1.45; margin: 10px 0 0; max-width: 62ch; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hp { display: flex; align-items: center; gap: 12px; margin-top: 14px; max-width: 440px; }
.hp .bar { flex: 1; background: rgba(0, 0, 0, .55); }
.hl { color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
.hc { color: #9A9CA8; font-size: 13px; margin-top: 4px; }
.hb { display: flex; gap: 12px; margin-top: 16px; }
.hb .btn { height: 48px; min-height: 48px; flex: 1 1 0; min-width: 0; padding: 0 16px; border: 1px solid transparent; }
.hb .btn svg { flex: none; }
.hb .btn svg { width: 20px; height: 20px; }
.hb .btn.ghost { background: rgba(24, 26, 32, .6); border-color: #2A2D36; }
@media (min-width: 600px) {
  .hin { flex-direction: row; align-items: center; gap: 24px; }
  .hcv { align-self: center; }
  .hd { -webkit-line-clamp: 3; }
  .hb .btn { flex: none; min-width: 140px; }
}

/* rows */
.hsec { margin-top: var(--row-gap); }
.hsec h2 { display: flex; align-items: baseline; margin: 0 0 var(--row-head-gap); font-size: 18px; font-weight: 600; line-height: 1.25; }
.hsec h2 span { margin-left: 8px; color: #9A9CA8; font-size: 13px; font-weight: 400; }
.hrow { scroll-snap-type: x mandatory; padding-bottom: 6px; }

/* cards (home rows + library grid share the cover, progress bar and labels) */
.pc { width: var(--cw); flex: none; text-align: left; scroll-snap-align: start; border-radius: var(--radius); }
.pc .cv { width: var(--cw); height: auto; aspect-ratio: 1; border-radius: var(--radius); }
.cv > .bar { position: absolute; z-index: 2; left: 8px; right: 8px; bottom: 8px; height: 4px; margin: 0; border-radius: 2px; background: rgba(0, 0, 0, .55); }
.cv > .bar i { background: #F5A524; border-radius: 2px; }
.pc .num { position: absolute; z-index: 2; left: 8px; top: 8px; width: 22px; height: 22px; padding: 0; border-radius: 999px; background: rgba(14, 15, 19, .82); color: var(--text); font-size: 12px; font-weight: 700; line-height: 1; display: grid; place-items: center; }
.pc .num.wide { width: auto; min-width: 22px; padding: 0 6px; }
.pc .t, .gc .t { font-size: 15px; font-weight: 600; line-height: 1.25; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc .a, .gc .a { color: #9A9CA8; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the selected card: amber line along the bottom of its cover (no outline) */
.pc.sel .cv::after { content: ""; position: absolute; inset: 0; z-index: 3; border-radius: inherit; box-shadow: inset 0 -3px 0 #F5A524; pointer-events: none; }
.pc:focus-visible, .gc:focus-visible { outline-offset: 3px; }
.gc .done { z-index: 3; }

/* empty / no-results */
.empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 28px 20px; margin-top: 16px; text-align: center; background: var(--card); border: 1px solid #1f2128; border-radius: var(--radius); }
.empty b { font-size: 17px; font-weight: 600; }
.empty p { max-width: 36ch; margin: 4px 0 14px; }
.eico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--accent); margin-bottom: 8px; }
.eico svg { width: 22px; height: 22px; }
.grid .gempty { grid-column: 1 / -1; margin-top: 4px; }

/* recap sheet + settings */
.rc { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.rc b { font-size: 15px; font-weight: 600; }
.rc p { color: #C9CAD2; font-size: 14px; line-height: 1.45; margin: 6px 0 0; }
.rc .btns { margin-top: 10px; gap: 8px; }
.rc .btn.small { min-height: 44px; padding: 0 20px; }
.link { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px; padding: 0 2px; color: #F5A524; font-size: 14px; font-weight: 500; }
.tplrow { margin-top: 14px; }
.tplrow b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
textarea.tpl { min-height: 92px; }

.meta .mi { white-space: nowrap; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
</style>
</head>
<body>
<div id="app">
  <!-- Home -->
  <section id="v-home" class="view"><div class="wrap">
    <div class="head appbar"><h1 class="brand">Fireside</h1><button class="ring" data-act="settings" aria-label="Settings"></button></div>
    <div id="home-body"></div>
  </div></section>

  <!-- Library -->
  <section id="v-library" class="view hidden"><div class="wrap">
    <div class="head appbar"><h1>Library</h1></div>
    <label class="search"><span id="i-search"></span><input id="q" type="search" placeholder="Search your books" autocomplete="off"></label>
    <div class="chips"><button class="chip on" data-f="all">All</button><button class="chip" data-f="progress">In Progress</button><button class="chip" data-f="finished">Finished</button></div>
    <div class="grid" id="grid"></div>
  </div></section>

  <!-- Now Playing -->
  <section id="v-player" class="view hidden"><div class="pwrap">
    <div class="ptop appbar"><button class="x" data-act="close" aria-label="Close"></button><h1 class="ttl">Now Playing</h1><div id="p-timer"></div></div>
    <div id="p-empty" class="none" style="text-align:center;margin-top:40px">Nothing playing yet. Pick a book in your Library.</div>
    <div id="p-main">
      <div class="cv pcover" id="p-cover"></div>
      <div class="ptitle" id="p-title"></div>
      <div class="pauthor meta" id="p-author"></div>
      <div class="chapnav"><button class="cn" data-act="chapter" data-dir="-1" aria-label="Previous chapter" id="i-cprev"></button><div class="pchap" id="p-chap"></div><button class="cn" data-act="chapter" data-dir="1" aria-label="Next chapter" id="i-cnext"></button></div>
      <div class="seek" id="p-seek" aria-label="Seek"><div class="tr"></div><div class="fl" id="p-fill"></div><div class="kn" id="p-knob"></div></div>
      <div class="times"><b id="p-el">0:00</b><span id="p-rem">-0:00</span></div>
      <div class="bookleft" id="p-left"></div>
      <div class="ctrls">
        <button class="cb" data-act="skip" data-ms="-60000" aria-label="Back 1 minute"><span class="c" id="i-b60"></span><span class="lbl">-1m</span></button>
        <button class="cb" data-act="skip" data-ms="-30000" aria-label="Back 30 seconds"><span class="c" id="i-b30"></span><span class="lbl"></span></button>
        <button class="cb big" data-act="toggle" aria-label="Play"><span class="c" id="p-play"></span></button>
        <button class="cb" data-act="skip" data-ms="30000" aria-label="Forward 30 seconds"><span class="c" id="i-f30"></span><span class="lbl"></span></button>
        <button class="cb" data-act="skip" data-ms="60000" aria-label="Forward 1 minute"><span class="c" id="i-f60"></span><span class="lbl">+1m</span></button>
      </div>
      <div class="speed"><button data-act="speed" data-dir="-1" aria-label="Slower" id="i-minus"></button><button class="sv" id="p-speed" data-act="speed-reset" aria-label="Playback speed. Tap to reset to 1.00x">1.00x</button><button data-act="speed" data-dir="1" aria-label="Faster" id="i-plus"></button></div>
      <div class="speedcap">Speed · 5% steps · tap the number for 1.00x</div>
      <div class="extras">
        <button class="pill" id="b-sleep" data-act="sleep"><span id="i-moon"></span>Sleep</button>
        <button class="pill" data-act="bookmarks"><span id="i-mark"></span>Bookmarks</button>
        <button class="pill" data-act="recap"><span id="i-spark"></span>Recap</button>
      </div>
    </div>
  </div></section>

  <nav id="nav">
    <button data-tab="home" class="on">Home</button>
    <button data-tab="library">Library</button>
    <button data-tab="player"><span id="i-now"></span>Now Playing</button>
  </nav>
</div>
<div id="sheets"></div>
<div id="toast" class="hidden" role="status"></div>
<div id="scanbar" class="hidden" role="status"></div>
<script id="core">/* ===== Fireside core: no DOM. Saved spots, book math, rules, recap prompt, and the two playback engines
   (Android native bridge, or in-browser <audio> for the hosted preview). Unit-tested with node. ===== */
(function (root) {
  'use strict';
  const FS = {};
  const AUDIO_RE = /\.(mp3|m4b|m4a|mp4|aac|ogg|opus|flac|wav)$/i;

  // ---------- speed ----------
  FS.STEP = 0.05;
  FS.clampSpeed = (s) => {
    if (!isFinite(s)) return 1;
    let v = Math.round(s / 0.05) * 0.05;
    v = Math.min(3, Math.max(0.5, v));
    return Math.round(v * 100) / 100;
  };
  FS.stepSpeed = (s, dir) => FS.clampSpeed(s + dir * FS.STEP);

  // ---------- book math (same as BookMath.kt) ----------
  const BM = FS.BookMath = {
    total: (d) => d.reduce((a, b) => a + b, 0),
    toGlobal(d, t, p) { let g = 0; for (let i = 0; i < Math.min(t, d.length); i++) g += d[i]; return g + p; },
    fromGlobal(d, g) {
      if (!d.length) return [0, 0];
      let rem = Math.max(0, Math.min(g, BM.total(d)));
      for (let i = 0; i < d.length; i++) {
        if (rem < d[i] || i === d.length - 1) return [i, Math.min(rem, d[i])];
        rem -= d[i];
      }
      return [d.length - 1, d[d.length - 1]];
    },
    skip(d, t, p, delta) { return d.length ? BM.fromGlobal(d, BM.toGlobal(d, t, p) + delta) : [0, Math.max(0, p + delta)]; },
    chapterEnds(d, ch) {
      if (d.length === 1 && ch && ch.length > 1) return ch.slice(1).map((c) => c.s).concat([d[0]]).filter((x) => x > 0);
      let acc = 0; return d.map((x) => (acc += x));
    },
    /** Chapter starts (global ms): embedded marks for a one-file book, else each file's start. */
    chapterStarts(d, ch) {
      if (d.length === 1 && ch && ch.length > 1) return ch.map((c) => c.s).sort((a, b) => a - b);
      let acc = 0; return d.map((x) => { const s = acc; acc += x; return s; });
    },
    /** Previous: this chapter's start when more than 3 s in, else the one before. Next: null on the last chapter. */
    chapterTarget(starts, g, dir, restart) {
      if (!starts.length) return dir < 0 ? 0 : null;
      let i = 0; for (let k = 0; k < starts.length; k++) if (starts[k] <= g) i = k;
      if (dir < 0) return (g - starts[i] > (restart == null ? 3000 : restart) || i === 0) ? starts[i] : starts[i - 1];
      return i + 1 < starts.length ? starts[i + 1] : null;
    },
    chapterIndex(ends, g) { for (let i = 0; i < ends.length; i++) if (g < ends[i]) return i; return Math.max(0, ends.length - 1); },
  };

  // ---------- rules (same as Rules.kt) ----------
  FS.smartRewindMs = (paused) => paused < 60e3 ? 0 : paused < 600e3 ? 5e3 : paused < 3600e3 ? 15e3 : 30e3;
  FS.FADE_MS = 10e3;
  FS.fadeVolume = (rem) => rem >= FS.FADE_MS ? 1 : Math.max(0, Math.min(1, rem / FS.FADE_MS));

  // ---------- recap prompt ----------
  FS.DEFAULT_TEMPLATE = 'Give me a summary of {series} book {bookNumber} ({title}), chapter {chapter}, without spoilers past this chapter.';
  const KW = '(?:book|bk\\.?|vol\\.?|volume|no\\.?|part|#)';
  const NOT_SERIES = /^(the|a|an|of|book|bk|vol|volume|part|no|chapter)$/i;
  const tidy = (s) => (s || '').replace(/_/g, ' ').replace(/\s+/g, ' ').replace(/^[\s,:;\-–—.]+|[\s,:;\-–—]+$/g, '').trim();

  /** "Cradle 10 - Bloodline", "Cradle Book 10 Bloodline", "10. Bloodline", "Bloodline (Cradle, Book 10)" ... */
  FS.parseName = function (raw) {
    let s = String(raw || '').replace(AUDIO_RE, '').replace(/_/g, ' ');
    s = s.replace(/\s*[\[(](?:unabridged|abridged|audiobook|audio ?book|mp3|m4b)[\])]\s*/gi, ' ').replace(/\s+/g, ' ').trim();
    let m;
    const num = '(\\d{1,3}(?:\\.\\d)?)';
    // Title (Series, Book 10) / Title [Series #10]
    if ((m = s.match(new RegExp('^(.+?)\\s*[\\[(]\\s*(.*?[A-Za-z].*?)[\\s,]*' + KW + '?\\s*#?' + num + '\\s*[\\])]$', 'i'))) && !NOT_SERIES.test(tidy(m[2])))
      return { title: tidy(m[1]), series: tidy(m[2]), number: m[3] };
    // Series 10 - Title / Series, Book 10: Title / Series #10 Title
    if ((m = s.match(new RegExp('^(.*?[A-Za-z].*?)[\\s,]*(?:-\\s*)?' + KW + '?\\s*#?' + num + '\\s*(?:[-–—:.)]\\s*|\\s+)(.*[A-Za-z].*)$', 'i'))) && !NOT_SERIES.test(tidy(m[1])))
      return { series: tidy(m[1]), number: m[2], title: tidy(m[3]) };
    // 10. Title / Book 10 - Title
    if ((m = s.match(new RegExp('^' + KW + '?\\s*#?' + num + '\\s*(?:[-–—:.)]\\s*|\\s+)(.*[A-Za-z].*)$', 'i'))))
      return { number: m[1], title: tidy(m[2]) };
    // Series, Book 10 (no title)
    if ((m = s.match(new RegExp('^(.*?[A-Za-z].*?)[\\s,]*' + KW + '\\s*#?' + num + '$', 'i'))) && !NOT_SERIES.test(tidy(m[1])))
      return { series: tidy(m[1]), number: m[2] };
    return { title: tidy(s) };
  };

  // ---------- book labels: title / author / series / book # / narrator / year / description ----------
  // Tags win only when they are clean; otherwise the folder / file names are parsed:
  //   "Blackflame Cradle, Book 3" -> Cradle #3 "Blackflame"     "Dreadgod: Cradle, Book 11" -> Cradle #11 "Dreadgod"
  //   "Will Wight - Reaper Cradle, Volume 10" -> by Will Wight, Cradle #10 "Reaper"     "Wind and Truth" -> title only
  // The author falls back to the parent folder ("Will Wight/Blackflame Cradle, Book 3"), unless it's a generic name.
  const GENERIC_DIRS = /^(audio ?books?|books?|audio|music|downloads?|media|library|fantasy|sci-?fi|science fiction|fiction|non-?fiction|mystery|thriller|romance|horror|kids|children|series|new|other|misc(ellaneous)?|unsorted|podcasts?|storage|sdcard|primary|internal storage|!.*)$/i;
  const BAD_TAG = /^(unknown( artist| album)?|various( artists)?|audiobook|audiobooks|untitled|track ?\d*|chapter ?\d*|\d+|null|none|n\/a|-)$/i;
  const NUM_KW = '(?:book|bk\\.?|vol\\.?|volume|no\\.?|#)';
  const cleanVal = (v) => { const x = FS.fixColons(String(v == null ? '' : v)).replace(/\s+/g, ' ').trim(); return x.length >= 2 && /\p{L}/u.test(x) && !BAD_TAG.test(x) && !FS.looksLikeTrack(x) && !STRIP_EXT.has((x.match(/\.([a-z0-9]{2,4})$/i) || [])[1]?.toLowerCase()) ? x : ''; };
  FS.cleanTagValue = cleanVal;

  /** One name ("Blackflame Cradle, Book 3", a file name, a tag) -> { title, series, number, author, how }. */
  FS.parseBookName = function (raw, opts) {
    const o = opts || {}; const known = o.knownSeries || [];
    let x = FS.displayTitle(String(raw || '')).replace(/_/g, ' ');
    x = x.replace(/\s*[\[(](?:unabridged|abridged|audiobook|audio ?book|mp3|m4b)[\])]\s*/gi, ' ').replace(/\s+/g, ' ').trim();
    const res = {};
    for (const a of (o.authors || []).filter(Boolean).sort((p, q) => q.length - p.length)) {
      const r = new RegExp('^\\s*' + a.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[-\u2013\u2014:]\\s+', 'i');
      if (r.test(x)) { res.author = a.trim(); x = x.replace(r, ''); break; }
    }
    let m;
    // Title (Series, Book N) / Title [Series #N]
    if ((m = x.match(new RegExp('^(.+?)\\s*[\\[(]\\s*(.*?\\p{L}.*?)[\\s,]*' + NUM_KW + '?\\s*#?(\\d{1,3}(?:\\.\\d)?)\\s*[\\])]$', 'iu'))) && !NOT_SERIES.test(tidy(m[2])))
      return Object.assign(res, { title: tidy(m[1]), series: tidy(m[2]), number: m[3], how: 'paren' });
    // "<title> <series>, Book N" / "<title>: <series>, Book N" / "<title> Book N" / "<series>, Book N"
    if ((m = x.match(new RegExp('^(.*?\\p{L}.*?)(,?)\\s*' + NUM_KW + '\\s*#?(\\d{1,3}(?:\\.\\d)?)$', 'iu')))) {
      const pre = tidy(m[1]); const comma = !!m[2]; const n = m[3];
      const k = known.find((sr) => new RegExp('(^|[\\s:,-])' + sr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$', 'i').test(pre));
      if (pre.includes(':')) { const i = pre.lastIndexOf(':'); return Object.assign(res, { title: tidy(pre.slice(0, i)), series: tidy(pre.slice(i + 1)), number: n, how: 'colon' }); }
      if (k) { const t = tidy(pre.slice(0, pre.length - k.length)); return Object.assign(res, t ? { title: t, series: k, number: n } : { series: k, number: n }, { how: 'known' }); }
      const w = pre.split(' ');
      if (comma && w.length >= 2) return Object.assign(res, { title: tidy(w.slice(0, -1).join(' ')), series: w[w.length - 1], number: n, how: 'comma' });
      if (comma) return Object.assign(res, { series: pre, number: n, how: 'series-only' });
      if (!NOT_SERIES.test(pre)) return Object.assign(res, { title: pre, number: n, how: 'title-num' });
    }
    const p = FS.parseName(x);
    const how = p.series ? 'series-num' : p.number ? 'num-first' : 'title';
    return Object.assign(res, p, { how });
  };

  /** Series names seen in two or more books' names ("<title> Cradle, Book N" twice -> "Cradle"), plus series tags. */
  FS.knownSeries = function (books) {
    const count = new Map();
    for (const b of books || []) {
      const t = b.tags || {}; const seen = new Set();
      for (const n of nameCandidates(b)) {
        const m = FS.displayTitle(n).match(new RegExp('^(.*?\\p{L}.*?),\\s*' + NUM_KW + '\\s*#?\\d{1,3}$', 'iu')); if (!m) continue;
        const w = tidy(m[1].replace(/^.*:/, '')).split(' ');
        for (let k = 1; k <= Math.min(3, w.length - 1); k++) seen.add(w.slice(-k).join(' '));
      }
      if (cleanVal(t.series)) seen.add(cleanVal(t.series));
      for (const x of seen) count.set(x.toLowerCase(), [x, ((count.get(x.toLowerCase()) || [x, 0])[1]) + 1]);
    }
    return [...count.values()].filter(([x, c]) => c >= 2 || (books || []).some((b) => cleanVal((b.tags || {}).series).toLowerCase() === x.toLowerCase()))
      .map(([x]) => x).sort((a, b) => b.length - a.length);
  };
  function nameCandidates(b) {
    const t = b.tags || {}; const out = [];
    if (t.name) out.push(t.name);
    if ((b.tracks || []).length === 1 && b.tracks[0].name) out.push(b.tracks[0].name);
    if (b.title) out.push(b.title);
    return out.filter((x, i) => out.indexOf(x) === i);
  }

  /** Labels for one book. ctx: { knownSeries, tagCounts } from FS.libraryMeta (optional). */
  // a grouping / album tag like "Orchard Cycle, Book 2" names the whole series (no title in front of it)
  const tagSeries = (v, o) => { const p = FS.parseName(FS.fixColons(String(v))); return p.series && p.number && !p.title ? p : FS.parseBookName(v, o); };
  FS.bookMeta = function (book, ctx) {
    const c = ctx || {}; const t = book.tags || {};
    const parent = t.parent && !GENERIC_DIRS.test(t.parent.trim()) ? FS.fixColons(t.parent.trim()) : '';
    const tagAuthor = cleanVal(t.albumArtist) || cleanVal(t.artist) || cleanVal(book.author);
    const authors = [tagAuthor, parent].filter(Boolean);
    const parses = nameCandidates(book).map((n) => FS.parseBookName(n, { authors, knownSeries: c.knownSeries }));
    const score = (q) => (q.series ? 2 : 0) + (q.number ? 2 : 0) + (q.title ? 1 : 0);
    const best = parses.reduce((a, q) => (score(q) > score(a) ? q : a), parses[0] || {});
    let series = cleanVal(t.series), number = t.part ? String(t.part).replace(/\/.*/, '').trim() : '';
    if (t.grouping) {
      const g = tagSeries(t.grouping, { knownSeries: c.knownSeries });
      if (g.number) { series = series || g.series || ''; number = number || g.number; } else if (!series && cleanVal(g.title) && g.title !== t.album) series = g.title;
    }
    const alb = t.album ? tagSeries(t.album, { authors, knownSeries: c.knownSeries }) : {};
    if (alb.number) { series = series || alb.series || ''; number = number || alb.number; }
    series = series || best.series || '';
    number = number || best.number || '';
    if (!number && series && t.series && !book.folder && t.track) number = String(t.track).replace(/\/.*/, '').trim();
    let usedParentAsSeries = false;
    if (!series && number && best.how === 'num-first' && parent) { series = tidy(FS.parseName(parent).title || parent); usedParentAsSeries = true; }
    // title: a clean title tag, then a clean album tag (never the series name, never one shared by several books), then the names
    const okTitle = (v) => {
      const x = cleanVal(v); if (!x) return '';
      const q = FS.parseBookName(x, { authors, knownSeries: c.knownSeries });
      const tt = q.title || (q.series ? '' : x);
      if (!tt || (series && tt.toLowerCase() === series.toLowerCase())) return '';
      if (c.tagCounts && (c.tagCounts[tt.toLowerCase()] || 0) > 1) return '';
      // 1.0.4 guard: when the folder / file name is a real title, the tag must share a word with it
      const ref = nameCandidates(book)[0] || '';
      const refTitle = parses[0] && parses[0].title || '';
      const sw = new Set(words(series || '')); // "Cradle 9": only the series name, no title words to compare with
      const fw = new Set(words(refTitle).filter((w) => w.length >= 3 && /\p{L}/u.test(w) && !sw.has(w)));
      const idLike = /^[\w.-]+$/.test(FS.displayTitle(ref).trim()) && /\d/.test(ref); // B0C9XYZ, 0012345
      if (fw.size && !idLike && !FS.looksLikeTrack(ref) && !words(x).some((w) => fw.has(w))) return '';
      return tt;
    };
    let title = okTitle(t.title) || (alb.number ? (alb.title || '') : okTitle(t.album)) || best.title || '';
    if (!title) title = (parses.find((q) => q.title) || {}).title || FS.displayTitle(book.title || '');
    if (series && title && series.toLowerCase() === title.toLowerCase() && !best.title) title = FS.displayTitle(book.title || '');
    let author = tagAuthor || best.author || (parses.find((q) => q.author) || {}).author || (!usedParentAsSeries ? parent : '');
    const narr = cleanVal(t.narrator) || cleanVal(t.writer) || cleanVal(t.composer);
    const year = (String(t.year || '').match(/\b(1[5-9]|20)\d\d\b/) || [''])[0];
    const cm = String(t.comment || '').trim();
    const desc = String(t.desc || '').trim() || (cm.length > 40 ? cm : '');
    if (number) { number = String(parseFloat(number)); if (number === 'NaN') number = ''; }
    return { title, author, series, number, narrator: narr && narr !== author ? narr : '', year, desc };
  };

  /** Labels for every book (series names learnt across the library; a tag title used by several books is not a title). */
  FS.libraryMeta = function (books) {
    const knownSeries = FS.knownSeries(books);
    const tagCounts = {};
    for (const b of books || []) {
      const t = b.tags || {}; const seen = new Set();
      for (const v of [t.title, t.album]) { const x = cleanVal(v).toLowerCase(); if (x) seen.add(x); }
      for (const x of seen) tagCounts[x] = (tagCounts[x] || 0) + 1;
    }
    const out = {};
    for (const b of books || []) out[b.id] = FS.bookMeta(b, { knownSeries, tagCounts });
    return out;
  };

  /** Series / book number / title for the recap prompt (from FS.bookMeta). */
  FS.recapFields = function (book, chapter, meta) {
    const m = meta || FS.bookMeta(book);
    return { series: m.series, bookNumber: m.number, n: m.number, title: m.title, author: m.author || '', chapter: chapter == null ? '' : String(chapter) };
  };

  /** Fill {tokens}; a missing value drops its clause ("book {bookNumber}", "({title})", ", chapter {chapter}", "by {author}"). */
  FS.fillTemplate = function (tpl, f) {
    const has = (k) => f[k] != null && String(f[k]).trim() !== '';
    let s = String(tpl || FS.DEFAULT_TEMPLATE);
    s = s.replace(/([,;]?)(\s*)\b(book|chapter|part|volume|vol\.?|no\.?|#)\s*\{(\w+)\}/gi, (m, c, sp, w, k) => has(k) ? m : '');
    s = s.replace(/\s*\(\s*\{(\w+)\}\s*\)/g, (m, k) => has(k) ? m : '');
    s = s.replace(/\s*\bby\s+\{(\w+)\}/gi, (m, k) => has(k) ? m : '');
    s = s.replace(/\s*\/\s*\{(\w+)\}/g, (m, k) => has(k) ? m : '');
    s = s.replace(/#\{(\w+)\}/g, (m, k) => has(k) ? m : '');
    s = s.replace(/\{(\w+)\}/g, (m, k) => has(k) ? String(f[k]).trim() : '');
    s = s.replace(/\(\s*\)/g, '').replace(/[ \t]+/g, ' ').replace(/\s+([,.;:!?)])/g, '$1').replace(/\(\s+/g, '(')
      .replace(/\b(around|at)\s*\/\s*/gi, '$1 ').replace(/\s*\/\s*(?=[,.;:)]|$)/g, '').replace(/,?\s*\b(around|at)\s*(?=[,.;:)])/gi, '')
      .replace(/,\s*,/g, ',').replace(/\b(of|for|about|on|in|before|after)\s+\(([^()]+)\)/gi, '$1 $2').replace(/\b(of|for|about|on)\s*,\s*/gi, '$1 ')
      .replace(/(^|\s)[-–—](?=\s*[-–—,.]|\s*$)/g, '').replace(/^(\S+)\s+[-–—]\s+/, '$1 ');
    return s.trim();
  };

  // ---------- recap prompt menu ----------
  FS.TEMPLATES = {
    chapter: FS.DEFAULT_TEMPLATE,
    bookmark: "Explain what's happening at this point in {series} book {n} ({title}), around chapter {chapter} / {timestamp}, without spoilers past this point.",
    before: 'Get me up to speed before {title} ({series} book {n}) by {author}: lore, world, characters and important info from earlier books, with no spoilers for this book.',
    after: 'Give me a full recap of {title} ({series} book {n}) and its impact on the series.',
  };
  FS.TEMPLATE_LABELS = { chapter: 'This chapter', bookmark: 'This bookmark', before: 'Before this book', after: 'After this book' };
  /** kind: chapter | bookmark | before | after. o: { tpl, meta, chapter, timestamp, note } */
  FS.recapPrompt = function (kind, book, o) {
    const x = o || {};
    const f = Object.assign(FS.recapFields(book, kind === 'chapter' || kind === 'bookmark' ? x.chapter : null, x.meta), { timestamp: x.timestamp || '' });
    let s = FS.fillTemplate(x.tpl || FS.TEMPLATES[kind] || FS.DEFAULT_TEMPLATE, f);
    const note = String(x.note || '').trim();
    if (kind === 'bookmark' && note) s += ` My note at this point: "${note}"`;
    return s;
  };

  /** Chapter number for the prompt: M4B chapter ("Chapter 12: ..." -> 12, else its position), or the file number. */
  FS.chapterInfo = function (book, track, pos) {
    const d = (book.tracks || []).map((x) => x.d || 0);
    const ch = book.ch || [];
    if (d.length === 1 && ch.length > 1) {
      const i = BM.chapterIndex(BM.chapterEnds(d, ch), BM.toGlobal(d, track, pos));
      const name = ch[i].n || '';
      const m = name.match(/(?:chapter|ch\.?|part)\s*(\d+)/i) || name.match(/^\s*(\d+)\b/);
      return { index: i, count: ch.length, name, number: m ? m[1] : String(i + 1) };
    }
    if (d.length > 1) return { index: track, count: d.length, name: (book.tracks[track] || {}).name || '', number: String(track + 1) };
    return { index: 0, count: 1, name: '', number: '' };
  };

  // ---------- saved spots for the browser preview (same JSON as PositionStore.kt; v2 data reads as-is into v3) ----------
  class WebStore {
    constructor(storage, key) { this.st = storage; this.key = key || 'fireside.positions'; this.load(); }
    load() {
      let o = {};
      try { o = JSON.parse(this.st.getItem(this.key) || '{}'); } catch (e) { o = {}; }
      this.v = 3; this.from = o.v || (o.books ? 1 : 0); this.books = o.books || {}; this.speed = FS.clampSpeed(o.speed || 1); this.last = o.last || null;
      this.autoResume = o.autoResume !== false;
    }
    flush() { this.st.setItem(this.key, JSON.stringify({ v: 3, speed: this.speed, last: this.last || '', autoResume: this.autoResume, books: this.books })); }
    get(id) { const b = this.books[id]; return b && b.u ? { t: b.t, p: b.p, u: b.u, s: b.s } : null; }
    save(id, t, p, now) { const b = this.books[id] || (this.books[id] = {}); b.t = Math.max(0, t | 0); b.p = Math.max(0, Math.round(p)); b.u = now || Date.now(); this.last = id; this.flush(); }
    speedFor(id) { return (id && this.books[id] && this.books[id].s) || this.speed; }
    setBookSpeed(id, s) { s = FS.clampSpeed(s); if (id) { const b = this.books[id] || (this.books[id] = {}); b.s = s; } this.speed = s; this.flush(); }
    bookmarks(id) { return ((this.books[id] || {}).bm || []).slice().sort((a, b) => a.t - b.t || a.p - b.p); }
    addBookmark(id, t, p, note, now) {
      const b = this.books[id] || (this.books[id] = {}); const l = b.bm || (b.bm = []);

  /** Browser preview: <audio> playback, spots in localStorage, demo books or a folder picked with <input webkitdirectory>. */
  FS.WebEngine = function (opts, emit) {

  // ---------- book names (same rules as Names.kt) ----------
  const STRIP_EXT = new Set(['mp4', 'm4b', 'm4a', 'mp3', 'aac', 'ogg', 'opus', 'flac', 'wav', 'jpg', 'jpeg', 'png', 'webp', 'cue', 'nfo', 'txt']);

      const t = x.replace(COPY_RE, '').trim(); const dot = t.lastIndexOf('.');
      const ext = dot > 0 ? t.slice(dot + 1).toLowerCase() : '';

      if (u === x) return x; x = u;
    }

  };

  FS.normKey = function (name, authors) {
    let x = FS.fixColons(FS.stem(name));
    for (const a of (authors || []).filter((y) => y && y.trim()).sort((p, q) => q.length - p.length)) {
      const r = new RegExp('^\\s*' + a.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*[-\u2013\u2014:,]\\s*', 'i');

  FS.sameBook = function (a, b) {
    if (!a || !b) return false; if (a === b) return true;
    const wa = a.split(' '), wb = b.split(' ');
    if (wa[0] !== wb[0]) return false;
    const nums = (w) => w.filter((x) => /^\d+$/.test(x)).join(',');
    if (nums(wa) !== nums(wb)) return false;

    if (baseName) { const m = imgs.filter((n) => FS.sameName(n, baseName)).sort((p, q) => p.length - q.length || (p < q ? -1 : 1))[0]; if (m) return m; }

  /** .cue sheet -> [{s: startMs, n: title}] (same as CueSheet.kt); fewer than 2 chapters -> []. */

      const line = raw.trim(); if (!line) continue;

  //   files that are the same book as one in a sub-folder (normalized title; the sub-folder copy wins)
  // - only audio files: one book per file when all are .m4b / "*.m4b.mp4" (the preview can't read chapters or

  const SYSTEM_DIRS = new Set(['android', 'lost.dir', '$recycle.bin', 'system volume information', 'found.000']);

      const dir = parts.slice(0, -1).join('/');

    const parentOf = (p) => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
    const out = [];
    const byName = (a, b) => nat.compare(a.name, b.name);
    const single = (x, dir) => { const dd = dirs.get(dir) || D(dir); return { id: 'w' + hash('file|' + x.name + '|' + (x.size || 0)), title: FS.displayTitle(x.name), folder: false,
      tracks: [x], images: dd.images, cues: dd.cues, parent: dir ? baseOf(dir) : '' }; };
    const singleBooks = (audio) => audio.length > 1 && audio.every((x) => /\.m4b$/i.test(x.name) || /\.m4b/i.test(x.name));
    function loose(audio, dir, found, authors) {
      const have = found.map((b) => [b, [b.dirName || '', b.title].map((n) => FS.normKey(n, authors))]);

  const seriesLine = (m) => m.series ? `${m.series}${m.number ? ' \u00b7 Book ' + m.number : ''}` : '';
  function lengthOf(ms) { const m = Math.round(ms / 60000); if (!m) return ''; const h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; }
  const byId = (id) => books().find((b) => b.id === id);
  const durs = (b) => (b.tracks || []).map((t) => t.d || 0);
  const total = (b) => FS.BookMath.total(durs(b));
  function where(b) {   // [track, pos] now
    if (ui.state.bookId === b.id && ui.state.pos != null && !ui.state.idle) return [ui.state.track || 0, ui.state.pos || 0];
    return b.spot ? [b.spot.t, b.spot.p] : [0, 0];
  }
  function bookPos(b) {
    const d = durs(b); const [t, p] = where(b);
    if (ui.state.bookId === b.id && ui.state.dur && d[t] !== undefined && !d[t]) d[t] = ui.state.dur;
    return FS.BookMath.toGlobal(d, t, p);
  }
  const pct = (b) => { const T = total(b); return T > 0 ? Math.min(1, bookPos(b) / T) : 0; };
  const started = (b) => !!(b.spot && b.spot.u) || ui.state.bookId === b.id;
  const finished = (b) => { const T = total(b); return T > 0 && started(b) && bookPos(b) >= T - Math.min(30000, T * 0.05); }; // last 30 s (or last 5% of a very short book)
  function clock(ms) {
    ms = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(ms / 3600), m = Math.floor((ms % 3600) / 60), s = ms % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
  }
  function left(ms) {
    const m = Math.round(ms / 60000); if (m < 1) return 'Under 1m left';
    const h = Math.floor(m / 60); return (h ? `${h}h ${m % 60}m` : `${m}m`) + ' left';
  }
  const fmtDate = (t) => t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h) % 360; }
  /** Cover box: generated title tile underneath, the real cover (thumbnail in lists, full size on Now Playing) on top. */
  function cover(b, cls, full) {
    const tile = `<div class="tile" style="background:linear-gradient(160deg,hsl(${hue(b.title)} 45% 34%),hsl(${(hue(b.title) + 40) % 360} 40% 16%))">${esc(M(b).title || b.title)}</div>`;
    const src = full ? b.cover : (b.thumb || b.cover);
    return `<div class="cv ${cls || ''}">${tile}${src ? `<img alt="" src="${esc(src)}" onerror="this.remove()">` : ''}`;
  }
  const chapterLine = (b) => {
    const [t, p] = where(b); const c = FS.chapterInfo(b, t, p);
    if (c.count <= 1) return '';
    return ((b.ch || []).length > 1 ? 'Chapter ' : 'Part ') + (c.index + 1) + ' of ' + c.count;
  };

  // ---------- home (Netflix-style: featured hero + horizontal rows) ----------
  // Touch: the first tap on a card selects it and the hero shows it; a second tap (or the hero's Play) plays it.
  // Keyboard / D-pad: focusing a card selects it; Enter plays; arrows move between cards and rows.
  const nat = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const almostDone = (b) => finished(b) || (started(b) && pct(b) >= 0.95);
  function homeRows() {
    const bs = books();
    const rows = [];
    const cont = bs.filter((b) => started(b) && !finished(b)).sort((a, b) => (ui.state.bookId === b.id) - (ui.state.bookId === a.id) || ((b.spot || {}).u || 0) - ((a.spot || {}).u || 0));
    if (cont.length) rows.push({ key: 'continue', title: 'Continue Listening', books: cont, progress: true });
    const groups = new Map();
    for (const b of bs) { const m = M(b); if (!m.series) continue; const k = m.series.toLowerCase(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); }
    const inSeries = new Set();
    [...groups.values()].filter((g) => g.length >= 2).sort((a, b) => nat.compare(M(a[0]).series, M(b[0]).series)).forEach((g) => {
      g.sort((a, b) => (parseFloat(M(a).number) || 1e9) - (parseFloat(M(b).number) || 1e9) || nat.compare(M(a).title, M(b).title));
      g.forEach((b) => inSeries.add(b.id));
      const authors = [...new Set(g.map((b) => M(b).author).filter(Boolean))];
      rows.push({ key: 'series:' + M(g[0]).series, title: M(g[0]).series, sub: authors.length === 1 ? authors[0] : '', books: g, numbers: true });
    });
    const other = bs.filter((b) => !inSeries.has(b.id)).sort((a, b) => nat.compare(M(a).author || '\uffff', M(b).author || '\uffff') || nat.compare(M(a).title, M(b).title));
    if (other.length) rows.push({ key: 'other', title: groups.size ? 'Other authors & standalones' : 'Your books', books: other });
    rows.push({ key: 'recent', title: 'Recently Added', books: bs.slice().sort((a, b) => (b.added || 0) - (a.added || 0)).slice(0, 12) });
    return rows;
  }
  function heroBook() {
    const id = [ui.heroId, ui.state.bookId, ui.lib.last].find((x) => x && byId(x));
    if (id) return byId(id);
    const rows = homeRows(); return rows.length && rows[0].books.length ? rows[0].books[0] : null;
  }
  function card(b, row) {
    const m = M(b); const p = pct(b);
    const sel = ui.heroId === b.id ? ' sel' : '';
    const extra = row.progress ? `<div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div>` : '';
    const badge = row.numbers && m.number ? `<span class="num">${esc(m.number)}</span>` : '';
    const sub = row.progress ? (total(b) ? left(total(b) - bookPos(b)) : '') : (m.author || seriesLine(m));
    return `<button class="pc${sel}" data-pick="${b.id}" aria-label="${esc(m.title)}${m.author ? ', ' + esc(m.author) : ''}">${cover(b)}${badge}${extra}</div>
      <div class="t">${esc(m.title)}</div><div class="a">${esc(sub || '\u00a0')}</div></button>`;
  }
  function renderHero() {
    const el = $('#hero'); if (!el) return;
    const b = heroBook(); if (!b) { el.innerHTML = ''; return; }
    ui.heroShown = b.id;
    const m = M(b); const T = total(b); const st = started(b) && !finished(b);
    const meta = [m.author, ...seriesParts(m), lengthOf(T), m.year].filter(Boolean);
    const playing = ui.state.bookId === b.id && ui.state.playing;
    const cl = st ? chapterLine(b) : '';
    el.innerHTML = `<div class="hbg"><div class="hbgt" style="background:linear-gradient(160deg,hsl(${hue(b.title)} 45% 34%),hsl(${(hue(b.title) + 40) % 360} 40% 16%))"></div>${b.cover || b.thumb ? `<img alt="" src="${esc(b.cover || b.thumb)}" onerror="this.remove()">` : ''}</div>
      <div class="hin">${cover(b, 'hcv', true)}</div>
        <div class="htx">
          <div class="kick">${esc(st ? 'Continue listening' : almostDone(b) ? 'Finished' : m.series ? 'From your library' : 'Featured')}</div>
          <h2 class="ht">${esc(m.title)}</h2>
          <div class="hm meta">${metaHTML(meta)}</div>
          ${m.desc ? `<p class="hd">${esc(m.desc)}</p>` : (m.narrator ? `<p class="hd">Narrated by ${esc(m.narrator)}</p>` : '')}
          ${st ? `<div class="hp"><div class="bar"><i data-live="hbar" style="width:${(pct(b) * 100).toFixed(1)}%"></i></div><span class="hl" data-live="hleft">${T ? left(T - bookPos(b)) : ''}</span></div>${cl ? `<div class="hc">${esc(cl)}</div>` : ''}` : ''}
          <div class="hb"><button class="btn" data-act="hero-play" data-id="${b.id}">${playing ? I.now : I.play}${playing ? 'Playing' : st ? 'Resume' : almostDone(b) ? 'Listen again' : 'Play'}</button>
            <button class="btn ghost" data-act="hero-recap" data-id="${b.id}">${I.history}Recap</button></div>
        </div></div>`;
  }
  function renderHome() {
    const el = $('#home-body');
    const bs = books();
    if (!bs.length) {
      el.innerHTML = `<div class="empty"><span class="eico">${I.folder}</span><b>Pick your audiobooks folder</b><p>Choose the folder that holds your books. Each MP3/M4B file, or each folder of files, becomes one book.</p>
        <button class="btn" data-act="pick">${I.folder} Pick folder</button>
        ${engine.native ? '' : '<div class="btns" style="justify-content:center"><button class="btn ghost small" data-act="demo">Try demo books</button></div>'}</div>`;
      return;
    }
    if (ui.heroId && !byId(ui.heroId)) ui.heroId = null;
    const rows = homeRows();
    const keep = {}; document.querySelectorAll('#home-body .hrow').forEach((r) => { keep[r.dataset.row] = r.scrollLeft; });
    el.innerHTML = `<section class="hero" id="hero"></section>` + rows.map((r) => `<section class="hsec"><h2>${esc(r.title)}${r.sub ? `<span>${esc(r.sub)}</span>` : ''}</h2>
      <div class="hrow" data-row="${esc(r.key)}">${r.books.map((b) => card(b, r)).join('')}</div></section>`).join('');
    document.querySelectorAll('#home-body .hrow').forEach((r) => { if (keep[r.dataset.row]) r.scrollLeft = keep[r.dataset.row]; });
    renderHero();
  }
  function selectCard(id) {
    ui.heroId = id;
    document.querySelectorAll('#home-body .pc').forEach((c) => c.classList.toggle('sel', c.dataset.pick === id));
    renderHero();
  }

  // ---------- library ----------
  function renderLibrary() {
    const q = ui.query.trim().toLowerCase();
    let bs = books().filter((b) => { const m = M(b); return !q || [b.title, m.title, m.author, m.series, m.narrator].join(' ').toLowerCase().includes(q); })
      .sort((a, b) => nat.compare(M(a).author || '\uffff', M(b).author || '\uffff') || nat.compare(M(a).series || '', M(b).series || '') || (parseFloat(M(a).number) || 1e9) - (parseFloat(M(b).number) || 1e9) || nat.compare(M(a).title, M(b).title));
    if (ui.filter === 'progress') bs = bs.filter((b) => started(b) && !finished(b));
    if (ui.filter === 'finished') bs = bs.filter(finished);
    $('#grid').innerHTML = bs.length ? bs.map((b) => {
      const p = pct(b), f = finished(b); const m = M(b);
      return `<button class="gc" data-play="${b.id}">${cover(b)}${f ? `<span class="done">${I.check}</span>` : (started(b) ? `<div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div>` : '')}</div>
        <div class="t">${esc(m.title)}</div><div class="a">${esc(m.author || seriesLine(m) || '\u00a0')}</div></button>`;
    }).join('') : (books().length
      ? `<div class="empty gempty"><span class="eico">${I.search}</span><b>No books match${q ? ` \u201c${esc(ui.query.trim())}\u201d` : ''}</b><p>${q ? 'Try a title, author, series or narrator.' : (ui.filter === 'finished' ? 'Books you finish show up here.' : 'Books you have started show up here.')}</p>${q ? '<button class="btn ghost" data-act="clear-q">Clear search</button>' : ''}</div>`

    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.f === ui.filter));
  }
  function renderLists() { renderHome(); renderLibrary(); }
  function updateLive() {
    const id = ui.state.bookId; const b = id && byId(id); if (!b) return;
    if (ui.heroShown !== b.id) return;
    const bar = $('[data-live="hbar"]'); if (bar) bar.style.width = (pct(b) * 100).toFixed(1) + '%';
    const l = $('[data-live="hleft"]'); if (l && total(b)) l.textContent = left(total(b) - bookPos(b));
  }

  // ---------- now playing ----------
  function renderPlayer() {
    const b = ui.state.bookId && byId(ui.state.bookId);
    $('#p-empty').classList.toggle('hidden', !!b);
    $('#p-main').classList.toggle('hidden', !b);
    if (!b) return;
    const key = b.id + '|' + (b.cover || '');
    if ($('#p-cover').dataset.k !== key) { $('#p-cover').outerHTML = cover(b, 'pcover', true).replace('class="cv pcover"', 'class="cv pcover" id="p-cover" data-k="' + esc(key) + '"') + '</div>'; }
    const pm = M(b);
    $('#p-title').textContent = pm.title || b.title;
    $('#p-author').innerHTML = metaHTML([pm.author, ...seriesParts(pm)]);
    const [t, p] = where(b); const ci = FS.chapterInfo(b, t, p);
    $('#p-chap').textContent = ci.count > 1 ? ((b.ch || []).length > 1 ? (ci.name || 'Chapter ' + (ci.index + 1)) : (ci.name ? ci.name.replace(/\.[^.]+$/, '') : 'Part ' + (ci.index + 1))) : '';
    const dur = ui.state.dur || ((b.tracks[t] || {}).d) || 0;
    const pos = ui.seeking != null ? ui.seeking : p;
    const f = dur ? Math.min(1, pos / dur) : 0;
    $('#p-fill').style.width = (f * 100) + '%'; $('#p-knob').style.left = (f * 100) + '%';
    $('#p-el').textContent = clock(pos); $('#p-rem').textContent = '-' + clock(Math.max(0, dur - pos));
    $('#p-left').textContent = total(b) ? 'Book: ' + left(total(b) - bookPos(b)).replace(' left', '') + ' left' : '';
    $('#p-play').innerHTML = ui.state.playing ? I.pause : I.play;
    $('#p-play').setAttribute('aria-label', ui.state.playing ? 'Pause' : 'Play');
    const spd = ui.state.speed || b.speed || 1;
    $('#p-speed').textContent = spd.toFixed(2) + 'x';
    $('#p-speed').classList.toggle('off1', Math.abs(spd - 1) > 0.001);

    const tm = $('#p-timer');
    if (sl.mode !== 'off') { tm.className = 'timer'; tm.innerHTML = I.moon + (sl.mode === 'chapter' && sl.rem > 3600e3 ? 'Chapter' : clock(sl.rem)); }

  // ---------- sheets ----------
  function sheet(name, html) {

  }
  function closeSheet() { ui.sheet = null; $('#sheets').innerHTML = ''; }

    const sl = ui.state.sleep || { mode: 'off' };
    sheet('sleep', `<h3>Sleep timer</h3><div class="opts">${[5, 10, 15, 30, 45, 60].map((m) => `<button class="opt ${sl.mode === 'minutes' && sl.lastMin === m ? 'on' : ''}" data-sleep="${m}">${m} min</button>`).join('')}
      <button class="opt wide ${sl.mode === 'chapter' ? 'on' : ''}" data-sleep="chapter">End of chapter</button></div>
      <div class="field"><input id="sl-custom" type="number" inputmode="numeric" min="1" max="600" placeholder="Custom minutes"><button class="btn small" data-act="sleep-custom">Start</button></div>

  function renderBookmarks(refresh) {

      <div class="list">${list.length ? list.map((m) => {

  function openReport() {

      <div class="note">What the last scan saw in your folders: every folder, every file and why it was used or skipped. Folder and file names only. Send it with Copy or Share.</div>

  // ---------- recap menu ----------
  // from: 'player' (this chapter / before / after), 'hero' or 'book' (before / this chapter if started / after),
  // or a bookmark (its own prompt). "After" shows once the book is finished or ~95% through.
  function openRecap(b, from, bm) {
    if (!b) return;
    const m = M(b); const kinds = [];
    const chapterOf = (t, p) => FS.chapterInfo(b, t, p).number;
    if (bm) kinds.push('bookmark');
    else {
      if (from === 'player' || started(b)) kinds.push('chapter');
      kinds.push('before');
      if (almostDone(b)) kinds.push('after');
      if (from !== 'player') kinds.sort((x, y) => (x === 'before' ? -1 : y === 'before' ? 1 : 0));
    }
    const [t, p] = bm ? [bm.t, bm.p] : where(b);
    const ts = clock(FS.BookMath.toGlobal(durs(b), t, p));
    ui.recaps = {};
    for (const k of kinds) ui.recaps[k] = FS.recapPrompt(k, b, { tpl: tplFor(k), meta: m, chapter: chapterOf(t, p), timestamp: ts, note: bm ? bm.n : '' });
    sheet('recap', `<h3>Recap prompts</h3><div class="note" style="margin-top:-6px;margin-bottom:6px">${esc(m.title)}${m.series ? ' \u00b7 ' + esc(seriesLine(m)) : ''}. Copy one, then paste it into your AI chat app.</div>
      ${kinds.map((k) => `<div class="rc"><b>${FS.TEMPLATE_LABELS[k]}</b><p>${esc(ui.recaps[k])}</p>
        <div class="btns"><button class="btn small" data-rcopy="${k}">Copy</button><button class="btn ghost small" data-rshare="${k}">Share</button></div></div>`).join('')}
      <button class="link" data-act="open-prompts">Edit these prompts in Settings</button>`);
  }
  function copyRecap(k) {
    const s = (ui.recaps || {})[k]; if (!s) return;
    window.__lastRecap = s;
    closeSheet();
    engine.copyText(s).then((ok) => toast(ok === false ? 'Couldn\u2019t copy. Use Share.' : 'Recap prompt copied', 'Share', () => engine.shareText(s)));
  }
  let toastT;
  function toast(msg, action, fn) {
    const el = $('#toast'); clearTimeout(toastT);
    el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button id="toast-act">${esc(action)}</button>` : ''}`;
    el.classList.remove('hidden');
    if (action) $('#toast-act').onclick = () => { el.classList.add('hidden'); fn(); };
    toastT = setTimeout(() => el.classList.add('hidden'), 5000);
  }
  function showScan(m) {

  }

  // ---------- navigation ----------
  function go(tab) {
    if (tab === 'player' && ui.tab !== 'player') ui.prevTab = ui.tab;
    ui.tab = tab;
    ['home', 'library', 'player'].forEach((v) => $('#v-' + v).classList.toggle('hidden', v !== tab));
    $('#nav').classList.toggle('hidden', tab === 'player');
    document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    $('#nav [data-tab=home]').innerHTML = I.homeO + 'Home';   // 1.0.6: one glyph per tab, only the colour changes
    $('#nav [data-tab=library]').innerHTML = I.lib + 'Library';
  }
  window.firesideBack = () => {
    if (ui.sheet) { closeSheet(); return true; }
    if (ui.tab === 'player') { go(ui.prevTab || 'home'); return true; }
    if (ui.tab !== 'home') { go('home'); return true; }
    return false;
  };

  // ---------- events ----------
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act],[data-play],[data-pick],[data-open],[data-tab],[data-sleep],[data-jump],[data-del],[data-bmrecap],[data-rcopy],[data-rshare],.chip');
    if (!el) return;
    if (el.classList.contains('scrim') && ev.target !== el) return;
    const d = el.dataset;
    if (d.tab) { if (d.tab === 'player') go('player'); else go(d.tab); return; }
    if (d.play) { engine.play(d.play); go('player'); return; }
    if (d.pick) { if (ui.heroId === d.pick || (ui.kbd && document.activeElement === el && ui.heroId === d.pick)) playBook(d.pick); else selectCard(d.pick); return; }
    if (d.rcopy) { copyRecap(d.rcopy); return; }
    if (d.rshare) { const s2 = (ui.recaps || {})[d.rshare]; if (s2) engine.shareText(s2); return; }
    if (d.bmrecap) { const b = byId(ui.state.bookId); const bm = b && (b.bm || []).find((x) => String(x.c) === d.bmrecap); if (bm) openRecap(b, 'bookmark', bm); return; }
    if (d.open && !ev.target.closest('[data-act]')) { if (ui.state.bookId !== d.open) engine.play(d.open); go('player'); return; }
    if (el.classList.contains('chip')) { ui.filter = d.f; renderLibrary(); return; }
    if (d.sleep) { d.sleep === 'chapter' ? engine.sleep(0, true) : engine.sleep(+d.sleep, false); closeSheet(); toast(d.sleep === 'chapter' ? 'Sleeping at the end of this chapter' : `Sleep timer: ${d.sleep} min`); return; }
    if (d.jump) { const [t, p] = d.jump.split(':').map(Number); engine.jump(t, p); closeSheet(); toast('Jumped to bookmark'); return; }
    if (d.del) { engine.deleteBookmark(ui.state.bookId, +d.del); return; }
    switch (d.act) {
      case 'toggle': if (ui.state.bookId || ui.lib.last) { if (!ui.state.bookId || ui.state.idle) engine.play(ui.state.bookId || ui.lib.last); else engine.toggle(); } break;
      case 'skip': engine.skip(+d.ms); break;
      case 'speed': engine.setSpeed(FS.stepSpeed(ui.state.speed || 1, +d.dir)); break;
      case 'speed-reset': engine.setSpeed(1); toast('Speed 1.00x'); break;
      case 'chapter': engine.chapter(+d.dir); break;
      case 'root-rm':
        if (ui.armed !== d.uri) { ui.armed = d.uri; openSettings(); clearTimeout(ui.armT); ui.armT = setTimeout(() => { ui.armed = null; if (ui.sheet === 'settings') openSettings(); }, 4000); }
        else { ui.armed = null; engine.removeFolder(d.uri); toast('Folder removed. Saved spots are kept.'); setTimeout(openSettings, 80); }
        break;
      case 'close': go(ui.prevTab || 'home'); break;
      case 'settings': openSettings(); break;
      case 'pick': closeSheet(); engine.pickFolder(); break;
      case 'rescan': closeSheet(); engine.rescan(); break;
      case 'report': openReport(); break;
      case 'settings-back': openSettings(); break;
      case 'rep-copy': engine.copyText(ui.report || '').then((ok) => toast(ok === false ? 'Couldn\u2019t copy. Use Share.' : 'Scan report copied', 'Share', () => engine.shareText(ui.report || ''))); break;
      case 'rep-share': engine.shareText(ui.report || ''); break;
      case 'demo': closeSheet(); loadDemo(true); break;
      case 'sleep': openSleep(); break;
      case 'sleep-off': engine.sleepCancel(); closeSheet(); break;
      case 'sleep-custom': { const m = parseInt($('#sl-custom').value, 10); if (m > 0) { engine.sleep(Math.min(m, 600), false); closeSheet(); toast(`Sleep timer: ${m} min`); } break; }
      case 'bookmarks': renderBookmarks(false); break;
      case 'bm-add': engine.addBookmark($('#bm-note').value); $('#bm-note').value = ''; toast('Bookmark added'); setTimeout(() => renderBookmarks(true), 100); break;
      case 'recap': openRecap(byId(ui.state.bookId), 'player'); break;
      case 'hero-play': playBook(d.id); break;
      case 'clear-q': ui.query = ''; $('#q').value = ''; renderLibrary(); break;
      case 'open-prompts': openSettings(); setTimeout(() => { const h = $('#set-prompts'); if (h) h.scrollIntoView({ block: 'start' }); }, 30); break;
      case 'hero-recap': openRecap(byId(d.id), 'hero'); break;
      case 'auto': engine.setAutoResume(!(ui.lib.autoResume !== false)); setTimeout(openSettings, 50); break;
      case 'tpl-save':
        for (const k of Object.keys(FS.TEMPLATES)) { const ta = $(k === 'chapter' ? '#tpl' : '#tpl-' + k); if (!ta) continue; const v = ta.value.trim(); if (!v || v === FS.TEMPLATES[k]) localStorage.removeItem(tplKey(k)); else localStorage.setItem(tplKey(k), v); }
        toast('Recap prompts saved'); break;
      case 'tpl-reset': { const k = d.k || 'chapter'; localStorage.removeItem(tplKey(k)); const ta = $(k === 'chapter' ? '#tpl' : '#tpl-' + k); if (ta) ta.value = FS.TEMPLATES[k]; toast(FS.TEMPLATE_LABELS[k] + ' prompt reset'); break; }
      case 'close-sheet': if (ev.target === el) closeSheet(); break;
    }
  });
  $('#q').addEventListener('input', (e) => { ui.query = e.target.value; renderLibrary(); });
  // seek bar (current file)
  const seek = $('#p-seek');
  const frac = (e) => { const r = seek.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  const dur = () => ui.state.dur || 0;
  seek.addEventListener('pointerdown', (e) => { if (!dur()) return; seek.setPointerCapture(e.pointerId); ui.seeking = frac(e) * dur(); renderPlayer(); });
  seek.addEventListener('pointermove', (e) => { if (ui.seeking == null) return; ui.seeking = frac(e) * dur(); renderPlayer(); });
  seek.addEventListener('pointerup', (e) => { if (ui.seeking == null) return; engine.seek(frac(e) * dur()); ui.seeking = null; });

  // ---------- browser preview: demo books with generated tone audio ----------
  function demoAudio(b, t) {
    const sec = Math.round((b.tracks[t].d || 60000) / 1000), rate = 8000, n = sec * rate;
    const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
    const f = 196 + (hue(b.title) % 8) * 22 + t * 30; const bytes = new Uint8Array(buf, 44);
    for (let i = 0; i < n; i++) { const tt = i / rate; const env = (tt % 1) < 0.25 ? 1 : 0.15; bytes[i] = 128 + Math.round(10 * env * Math.sin(2 * Math.PI * f * tt)); }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  function loadDemo(toastIt) {
    const day = 86400e3, now = Date.now();
    const mk = (id, title, author, tracks, added, extra) => Object.assign({ id, title, author, tracks, added: now - added * day, ch: [], folder: tracks.length > 1, tags: { name: title } }, extra || {});
    const T = (n, sec) => Array.from({ length: n }, (_, i) => ({ name: `${String(i + 1).padStart(2, '0')} - Part ${i + 1}.mp3`, d: sec * 1000 }));
    const demo = [
      mk('demo-orchard', 'The Glass Orchard', 'A. Sample', [{ name: 'The Glass Orchard.m4b', d: 480000 }], 1, { ch: [{ s: 0, n: 'Chapter 1: Seeds' }, { s: 120000, n: 'Chapter 2: Frost' }, { s: 240000, n: 'Chapter 3: Harvest' }, { s: 360000, n: 'Chapter 4: Cider' }], tags: { name: 'The Glass Orchard', album: 'The Glass Orchard', grouping: 'Orchard Cycle, Book 2' } }),
      mk('demo-letters', 'Northbound Letters', 'B. Sample', T(3, 180), 3, { tags: { name: 'Northbound Letters' } }),
      mk('demo-quiet', 'Quiet Hours', 'C. Sample', [{ name: 'Quiet Hours.mp3', d: 300000 }], 6),
      mk('demo-cradle', 'Cradle 10 - Bloodline', 'Demo Narrator', T(4, 150), 9, { tags: { name: 'Cradle 10 - Bloodline' } }),
      mk('demo-harbor', 'Salt Harbor', 'D. Sample', [{ name: 'Salt Harbor.mp3', d: 420000 }], 12),
      mk('demo-ember', 'Ember Coast', 'E. Sample', T(2, 200), 15),
    ];
    engine.useBooks(demo, 'Demo books', true);
    if (toastIt) toast('Demo books loaded');
  }

  function playBook(id) {
    if (!id || !byId(id)) return;
    if (ui.state.bookId === id && !ui.state.idle) { if (!ui.state.playing) engine.toggle(); } else engine.play(id);
    go('player');
  }
  // touch selects on click; keyboard / D-pad focus selects right away
  document.addEventListener('pointerdown', () => { ui.kbd = false; }, true);
  document.addEventListener('keydown', (e) => {
    ui.kbd = true;
    const a = document.activeElement; if (!a || !a.closest || ui.tab !== 'home' || ui.sheet) return;
    const keys = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }; const mv = keys[e.key]; if (!mv) return;
    const lines = [[...document.querySelectorAll('#hero .hb .btn')], ...[...document.querySelectorAll('#home-body .hrow')].map((r) => [...r.querySelectorAll('.pc')])].filter((l) => l.length);
    let li = lines.findIndex((l) => l.includes(a)); if (li < 0) return;
    let ci = lines[li].indexOf(a);
    if (mv[0]) { const x = a.getBoundingClientRect().left; li = Math.max(0, Math.min(lines.length - 1, li + mv[0])); ci = lines[li].reduce((bi, el, i) => Math.abs(el.getBoundingClientRect().left - x) < Math.abs(lines[li][bi].getBoundingClientRect().left - x) ? i : bi, 0); }
    else ci = Math.max(0, Math.min(lines[li].length - 1, ci + mv[1]));
    const t = lines[li][ci]; if (t && t !== a) { e.preventDefault(); t.focus(); t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  });
  document.addEventListener('focusin', (e) => { const c = e.target.closest && e.target.closest('#home-body .pc'); if (c && ui.kbd && ui.heroId !== c.dataset.pick) selectCard(c.dataset.pick); });

  // ---------- static icons ----------
  const put = (sel, html) => { const el = $(sel); if (el) el.outerHTML = html; };
  $('.ring').innerHTML = I.gear; $('.ptop .x').innerHTML = I.chev;
  put('#i-search', I.search); put('#i-moon', I.moon); put('#i-mark', I.mark); put('#i-spark', I.history); put('#i-now', I.now);
  $('#i-minus').innerHTML = I.minus; $('#i-plus').innerHTML = I.plus;
  $('#i-cprev').innerHTML = I.cprev; $('#i-cnext').innerHTML = I.cnext;
  $('#i-b60').innerHTML = skipIcon('1m', true); $('#i-b30').innerHTML = skipIcon('30', true);
  $('#i-f30').innerHTML = skipIcon('30', false); $('#i-f60').innerHTML = skipIcon('1m', false);

  // ---------- start ----------
  go('home');
  if (engine.native) { engine.reload(); try { engine.onNative(JSON.parse(window.FiresideNative.state())); } catch (e) { /* first state comes from the service */ } }
  else loadDemo(false);
})();
</script>
</body>
</html>
